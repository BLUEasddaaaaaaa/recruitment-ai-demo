[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-ai-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40,<2",
    "sqlmodel>=0.0.22,<0.1",
    "openai>=1.109.1,<2",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<6",
    "python-docx>=1.1,<2",
    "pillow>=11,<12",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live_ai: requires explicit opt-in and real OpenAI credentials"]

[tool.ruff]
line-length = 100
target-version = "py312"
